name: Tests

# Antes de fusionar y en cada subida a develop/main:
#  - unit:  la batería de pytest (SQLite en memoria).
#  - mysql: las migraciones aplicadas desde cero sobre MySQL 8 y los flujos
#           de puntos de principio a fin, con peticiones simultáneas.
# La base de datos del trabajo «mysql» la crea GitHub para esta ejecución y
# se destruye al terminar: no es UAT ni guarda nada.

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Pruebas (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  mysql:
    name: Migraciones y flujos (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: km0lab
          MYSQL_USER: km0lab
          MYSQL_PASSWORD: km0lab
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # staging: como UAT, las tablas solo existen si las crean las migraciones.
      ENVIRONMENT: staging
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: km0lab
      DB_PASSWORD: km0lab
      DB_NAME: km0lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migraciones desde cero
        run: alembic upgrade head
      - name: Migraciones repetibles
        run: alembic upgrade head
      - name: Flujos de puntos contra MySQL
        run: python -m scripts.check_flows_mysql
