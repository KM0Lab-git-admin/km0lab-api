services:
  mysql:
    image: mysql:8.0
    container_name: km0lab-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: km0lab
      MYSQL_USER: km0lab
      MYSQL_PASSWORD: km0lab
    ports:
      - "3306:3306"
    # Named volume = data survives `docker compose down` (never use `down -v`
    # unless you intentionally want to wipe local MySQL including reward_media).
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--max_allowed_packet=64M",
      ]
    volumes:
      - km0lab_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: km0lab-api
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      DB_HOST: mysql
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  km0lab_mysql_data:
